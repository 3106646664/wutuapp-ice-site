server {
    listen 80;
    listen [::]:80;
    server_name wutuapp.com 47.122.112.12;
    root /var/www/wudaoapp/current;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml image/ktx2 application/wasm;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /reference { return 302 /reference/; }
    location /reference/ { try_files $uri /reference.html; }
    location ~* \.(?:js|css|json|wasm|ktx2|drc|ogg|mp3|wav|woff2?|svg|png|jpe?g|webp|ico)$ {
        try_files $uri =404;
        expires 1d;
    }
    location / { try_files $uri $uri/ /index.html; }
}
